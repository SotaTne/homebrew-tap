name: brew pr-pull

on:
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed

jobs:
  pr-pull:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check autopublish label
        id: autopublish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          label="$(gh pr view "$PULL_REQUEST" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '.labels[].name | select(. == "autopublish-bottle")')"

          if [[ "$label" == "autopublish-bottle" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR branch
        if: steps.autopublish.outputs.enabled == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          branch="$(gh pr view "$PULL_REQUEST" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRepositoryOwner \
            --jq ". | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\") | .headRefName")"

          if [[ -z "$branch" ]]; then
            echo "Pull request branch is not owned by $GITHUB_REPOSITORY_OWNER" >&2
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.autopublish.outputs.enabled == 'true'
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        if: steps.autopublish.outputs.enabled == 'true'
        uses: Homebrew/actions/git-user-config@main

      - name: Pull bottles
        if: steps.autopublish.outputs.enabled == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        if: steps.autopublish.outputs.enabled == 'true'
        uses: Homebrew/actions/git-try-push@main
        with:
          branch: ${{ steps.pr.outputs.branch }}
